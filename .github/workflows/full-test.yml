name: full-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exhaustive:
    name: exhaustive pinned gate
    runs-on: [self-hosted, macOS, troe-qemu-11-1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify runner prerequisites and complete test surface
        run: python3 scripts/test.py --require-filesystem-tools

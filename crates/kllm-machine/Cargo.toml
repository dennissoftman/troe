[package]
name = "kllm-machine"
description = "Audited native machine mechanisms for kllm QEMU targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
acceptance-probes = []

[dependencies]
kllm-memory = { path = "../kllm-memory" }
kllm-task = { path = "../kllm-task" }
kllm-terminal = { path = "../kllm-terminal" }
rlsf = { version = "=0.2.3", default-features = false }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "=0.39.0" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

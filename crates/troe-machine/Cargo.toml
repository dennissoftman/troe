[package]
name = "troe-machine"
description = "Audited native architecture and platform mechanisms for TROE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
acceptance-probes = []

[dependencies]
troe-driver = { path = "../troe-driver" }
troe-memory = { path = "../troe-memory" }
troe-task = { path = "../troe-task" }
troe-terminal = { path = "../troe-terminal" }
rlsf = { version = "=0.2.3", default-features = false }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "=0.39.0" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

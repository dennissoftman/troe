[package]
name = "troe-app-tail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.troe-kex]
capabilities = ["filesystem-read"]
# `tail` retains the trailing window of a non-seekable stream in a fixed ring;
# a seekable file is read backwards instead and needs no window.
stack-pages = 8

[dependencies]
troe-kex-sdk = { path = "../../sdk/rust/troe-kex" }

[[bin]]
name = "troe-app-tail"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

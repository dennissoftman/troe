[package]
name = "troe-app-arp"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[package.metadata.troe-kex]
capabilities = ["network-observe"]
stack-pages = 8

[dependencies]
troe-kex-sdk = { path = "../../sdk/rust/troe-kex" }

[profile.release]
codegen-units = 1
lto = false
opt-level = "z"
panic = "abort"
strip = "none"

[workspace]

[package]
name = "troe-app-mkdir"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[package.metadata.troe-kex]
# `-p` tests each ancestor's existence, so it reads as well as mutates.
capabilities = ["filesystem-read", "filesystem-mutate"]

[dependencies]
troe-kex-sdk = { path = "../../sdk/rust/troe-kex" }

[[bin]]
name = "troe-app-mkdir"
path = "src/main.rs"
test = false
bench = false

[profile.release]
codegen-units = 1
lto = false
opt-level = "z"
panic = "abort"
strip = "none"

[workspace]

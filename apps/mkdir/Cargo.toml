[package]
name = "troe-app-mkdir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.troe-kex]
# `-p` tests each ancestor's existence, so it reads as well as mutates.
capabilities = ["filesystem-read", "filesystem-mutate"]

[dependencies]
troe-kex-sdk = { path = "../../sdk/rust/troe-kex" }

[[bin]]
name = "troe-app-mkdir"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

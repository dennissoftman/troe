[workspace]
resolver = "3"
exclude = ["apps/*", "services/*"]
members = [
    "crates/*/*",
    "host",
    "kernel",
    "sdk/rust/troe-kex",
    "sdk/rust/troe-kex-alloc",
    "sdk/rust/troe-kex-c-runtime",
    "sdk/rust/troe-kex-runtime",
    "tools/troe-kex-tool",
    "xtask",
]
default-members = [
    "crates/common/troe-abi",
    "crates/common/troe-checksum",
    "crates/common/troe-completion",
    "crates/common/troe-core",
    "crates/device/troe-block",
    "crates/device/troe-driver",
    "crates/device/troe-platform",
    "crates/device/troe-virtio",
    "crates/net/troe-net",
    "crates/runtime/troe-application",
    "crates/runtime/troe-dispatch",
    "crates/runtime/troe-memory",
    "crates/runtime/troe-process",
    "crates/runtime/troe-random",
    "crates/runtime/troe-supervisor",
    "crates/runtime/troe-task",
    "crates/shell/troe-shell",
    "crates/shell/troe-terminal",
    "crates/storage/troe-fmt-bmnt",
    "crates/storage/troe-fmt-cspk",
    "crates/storage/troe-fmt-gpt",
    "crates/storage/troe-fmt-prgn",
    "crates/storage/troe-fmt-scfg",
    "crates/storage/troe-fs-api",
    "crates/storage/troe-fs-ext4",
    "crates/storage/troe-fs-fat",
    "crates/storage/troe-fs-statefs",
    "crates/storage/troe-identity",
    "crates/storage/troe-txslot",
    "crates/storage/troe-vfs",
    "crates/storage/troe-volume",
    "host",
    "sdk/rust/troe-kex",
    "sdk/rust/troe-kex-alloc",
    "sdk/rust/troe-kex-c-runtime",
    "sdk/rust/troe-kex-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

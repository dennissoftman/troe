[workspace]
resolver = "3"
members = [
    "crates/kllm-core",
    "crates/kllm-machine",
    "crates/kllm-memory",
    "crates/kllm-vfs",
    "crates/kllm-shell",
    "host",
    "kernel",
    "xtask",
]
default-members = [
    "crates/kllm-core",
    "crates/kllm-memory",
    "crates/kllm-vfs",
    "crates/kllm-shell",
    "host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

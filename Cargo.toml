[workspace]
resolver = "3"
exclude = ["apps/*", "services/*"]
members = [
    "crates/troe-abi",
    "crates/troe-application",
    "crates/troe-block",
    "crates/troe-checksum",
    "crates/troe-config",
    "crates/troe-completion",
    "crates/troe-content",
    "crates/troe-core",
    "crates/troe-dispatch",
    "crates/troe-driver",
    "crates/troe-ext4",
    "crates/troe-fat",
    "crates/troe-fs-api",
    "crates/troe-gpt",
    "crates/troe-identity",
    "crates/troe-machine",
    "crates/troe-memory",
    "crates/troe-mount",
    "crates/troe-net",
    "crates/troe-persist",
    "crates/troe-platform",
    "crates/troe-process",
    "crates/troe-random",
    "crates/troe-vfs",
    "crates/troe-shell",
    "crates/troe-storage",
    "crates/troe-supervisor",
    "crates/troe-statefs",
    "crates/troe-task",
    "crates/troe-terminal",
    "crates/troe-virtio",
    "host",
    "kernel",
    "sdk/rust/troe-kex",
    "sdk/rust/troe-kex-alloc",
    "sdk/rust/troe-kex-c-runtime",
    "sdk/rust/troe-kex-runtime",
    "tools/troe-kex-tool",
    "xtask",
]
default-members = [
    "crates/troe-abi",
    "crates/troe-application",
    "crates/troe-block",
    "crates/troe-checksum",
    "crates/troe-config",
    "crates/troe-completion",
    "crates/troe-content",
    "crates/troe-core",
    "crates/troe-dispatch",
    "crates/troe-driver",
    "crates/troe-ext4",
    "crates/troe-fat",
    "crates/troe-fs-api",
    "crates/troe-gpt",
    "crates/troe-identity",
    "crates/troe-memory",
    "crates/troe-mount",
    "crates/troe-net",
    "crates/troe-persist",
    "crates/troe-platform",
    "crates/troe-process",
    "crates/troe-random",
    "crates/troe-vfs",
    "crates/troe-shell",
    "crates/troe-storage",
    "crates/troe-supervisor",
    "crates/troe-statefs",
    "crates/troe-task",
    "crates/troe-terminal",
    "crates/troe-virtio",
    "host",
    "sdk/rust/troe-kex",
    "sdk/rust/troe-kex-alloc",
    "sdk/rust/troe-kex-c-runtime",
    "sdk/rust/troe-kex-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

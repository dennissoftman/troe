[package]
name = "kllm-kernel"
description = "Firmware-hosted kllm image composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
acceptance-probes = ["kllm-machine/acceptance-probes"]

[dependencies]
kllm-core = { path = "../crates/kllm-core" }
kllm-memory = { path = "../crates/kllm-memory" }
kllm-shell = { path = "../crates/kllm-shell" }
kllm-vfs = { path = "../crates/kllm-vfs" }

[target.'cfg(target_os = "uefi")'.dependencies]
kllm-machine = { path = "../crates/kllm-machine" }
uefi = { version = "=0.39.0" }

[lints]
workspace = true

[[bin]]
name = "kllm-kernel"
path = "src/main.rs"
test = false
bench = false

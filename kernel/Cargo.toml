[package]
name = "troe-kernel"
description = "Firmware-hosted TROE image composition root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
acceptance-probes = ["troe-machine/acceptance-probes"]

[dependencies]
troe-application = { path = "../crates/troe-application" }
troe-block = { path = "../crates/troe-block" }
troe-config = { path = "../crates/troe-config" }
troe-content = { path = "../crates/troe-content" }
troe-core = { path = "../crates/troe-core" }
troe-dispatch = { path = "../crates/troe-dispatch" }
troe-driver = { path = "../crates/troe-driver" }
troe-memory = { path = "../crates/troe-memory" }
troe-mount = { path = "../crates/troe-mount" }
troe-net = { path = "../crates/troe-net" }
troe-persist = { path = "../crates/troe-persist" }
troe-shell = { path = "../crates/troe-shell" }
troe-storage = { path = "../crates/troe-storage" }
troe-statefs = { path = "../crates/troe-statefs" }
troe-task = { path = "../crates/troe-task" }
troe-terminal = { path = "../crates/troe-terminal" }
troe-vfs = { path = "../crates/troe-vfs" }
troe-ext4 = { path = "../crates/troe-ext4" }
troe-gpt = { path = "../crates/troe-gpt" }

[target.'cfg(target_os = "uefi")'.dependencies]
troe-machine = { path = "../crates/troe-machine" }
uefi = { version = "=0.39.0" }

[lints]
workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

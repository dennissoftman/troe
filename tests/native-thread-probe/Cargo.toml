[package]
name = "troe-native-thread-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[dependencies]
troe-kex-sdk = { path = "../../sdk/rust/troe-kex", features = ["native-threads"] }

[profile.release]
codegen-units = 1
lto = false
opt-level = 2
panic = "abort"
strip = "none"

